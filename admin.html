<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Content Admin — Madhav Dental Clinic</title>
<link rel="stylesheet" href="assets/styles.css">
<style>
  body{padding:32px 0}
  .admin-wrap{max-width:720px;margin:0 auto;padding:0 20px}
  .admin-card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:24px;margin-bottom:20px}
  .admin-card h2{font-family:Georgia,serif;color:var(--dark);margin:0 0 16px;font-size:21px}
  .admin-field{margin-bottom:14px}
  .admin-field label{display:block;font-weight:700;font-size:14px;color:var(--dark);margin-bottom:6px}
  .admin-field input[type="text"],.admin-field input[type="password"],.admin-field input[type="url"],.admin-field textarea,.admin-field select{
    width:100%;border:1px solid var(--border);border-radius:8px;padding:10px 12px;font:inherit;font-size:15px;color:var(--body)
  }
  .admin-field textarea{min-height:80px;resize:vertical}
  .review-entry{border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:14px;background:var(--bg)}
  .review-entry-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .review-entry-head span{font-weight:700;color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:1px}
  .btn-remove{background:none;border:1px solid #b3261e;color:#b3261e;border-radius:8px;padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer}
  .btn-remove:hover{background:#b3261e;color:#fff}
  .btn-add{background:none;border:1px dashed var(--blue);color:var(--blue);border-radius:8px;padding:12px;width:100%;font-weight:700;cursor:pointer;font-size:14px}
  .btn-add:hover{background:var(--light)}
  .admin-status{margin-top:14px;font-size:14px;font-weight:700}
  .admin-status.ok{color:#0a7a3d}
  .admin-status.err{color:#b3261e}
  #lockScreen{max-width:400px;margin:80px auto 0}
  #app{display:none}
</style>
</head>
<body>
<div class="admin-wrap">

  <div id="lockScreen" class="admin-card">
    <h2>Content Admin</h2>
    <div class="admin-field">
      <label for="pwInput">Password</label>
      <div style="position:relative">
        <input type="password" id="pwInput" autocomplete="off" placeholder="Enter admin password" style="padding-right:44px">
        <button type="button" id="pwToggle" aria-label="Show password" title="Show password" style="position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;cursor:pointer;padding:6px;line-height:0;color:#5a6b7b">
          <svg id="eyeIcon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>
    <button class="btn btn-primary" id="unlockBtn" style="width:100%;text-align:center">Unlock</button>
    <p id="lockError" class="admin-status err" style="display:none">Incorrect password, or content couldn't be loaded.</p>
  </div>

  <div id="app">
    <div style="text-align:right;margin-bottom:12px"><button class="btn" id="logoutBtn" type="button">Log out</button></div>
    <div class="admin-card">
      <h2>Google Rating</h2>
      <div class="admin-field">
        <label for="ratingInput">Rating (e.g. 4.7)</label>
        <input type="text" id="ratingInput">
      </div>
    </div>

    <div class="admin-card">
      <h2>Clinic Hours</h2>
      <div class="admin-field">
        <label for="hoursInput">Shown on Visit Us page. One line per row, e.g. Monday – Sunday: 10:00 AM – 8:00 PM</label>
        <textarea id="hoursInput" rows="3"></textarea>
      </div>
    </div>

    <div class="admin-card">
      <h2>Reviews (newest shown first on the site)</h2>
      <div id="reviewsList"></div>
      <button class="btn-add" id="addReviewBtn">+ Add a review</button>
    </div>

    <button class="btn btn-primary" id="saveBtn" style="width:100%;text-align:center;padding:14px">Save Changes</button>
    <p id="saveStatus" class="admin-status" style="display:none"></p>
  </div>

</div>

<script>
let ADMIN_PASSWORD = '';
let currentContent = null;

const lockScreen = document.getElementById('lockScreen');
const app = document.getElementById('app');
const pwInput = document.getElementById('pwInput');
const unlockBtn = document.getElementById('unlockBtn');
const lockError = document.getElementById('lockError');
const ratingInput = document.getElementById('ratingInput');
const hoursInput = document.getElementById('hoursInput');
const reviewsList = document.getElementById('reviewsList');
const addReviewBtn = document.getElementById('addReviewBtn');
const saveBtn = document.getElementById('saveBtn');
const saveStatus = document.getElementById('saveStatus');
const logoutBtn = document.getElementById('logoutBtn');
const pwToggle = document.getElementById('pwToggle');
const eyeIcon = document.getElementById('eyeIcon');
const EYE_OPEN = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
const EYE_OFF = '<path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.5 18.5 0 0 1 5.06-5.94"/><path d="M9.9 4.24A10.9 10.9 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
pwToggle.addEventListener('click', () => {
  const show = pwInput.type === 'password';
  pwInput.type = show ? 'text' : 'password';
  eyeIcon.innerHTML = show ? EYE_OFF : EYE_OPEN;
  pwToggle.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
  pwToggle.title = show ? 'Hide password' : 'Show password';
});
pwInput.addEventListener('keydown', e => { if (e.key === 'Enter') unlockBtn.click(); });

logoutBtn.addEventListener('click', () => {
  ADMIN_PASSWORD = '';
  currentContent = null;
  pwInput.value = '';
  pwInput.type = 'password';
  eyeIcon.innerHTML = EYE_OPEN;
  ratingInput.value = '';
  hoursInput.value = '';
  reviewsList.innerHTML = '';
  saveStatus.style.display = 'none';
  lockError.style.display = 'none';
  app.style.display = 'none';
  lockScreen.style.display = 'block';
});

function renderReviews(reviews) {
  reviewsList.innerHTML = '';
  reviews.forEach((r, i) => addReviewEntry(r, i));
}

function addReviewEntry(review, index) {
  const div = document.createElement('div');
  div.className = 'review-entry';
  div.dataset.index = index;
  div.innerHTML = `
    <div class="review-entry-head">
      <span>Review ${index + 1}</span>
      <button type="button" class="btn-remove" data-action="remove">Remove</button>
    </div>
    <div class="admin-field">
      <label>Patient name</label>
      <input type="text" class="f-name" value="${(review.name || '').replace(/"/g,'&quot;')}">
    </div>
    <div class="admin-field">
      <label>Stars</label>
      <select class="f-stars">
        ${[5,4,3,2,1].map(n => `<option value="${n}" ${review.stars===n?'selected':''}>${n} star${n>1?'s':''}</option>`).join('')}
      </select>
    </div>
    <div class="admin-field">
      <label>Review text (verbatim — do not edit patient wording)</label>
      <textarea class="f-text">${(review.text || '')}</textarea>
    </div>
    <div class="admin-field">
      <label>Google review link (optional)</label>
      <input type="url" class="f-link" value="${(review.link || '').replace(/"/g,'&quot;')}">
    </div>
  `;
  div.querySelector('[data-action="remove"]').addEventListener('click', () => {
    div.remove();
  });
  reviewsList.appendChild(div);
}

addReviewBtn.addEventListener('click', () => {
  addReviewEntry({ name: '', stars: 5, text: '', link: '' }, reviewsList.children.length);
});

async function loadContent() {
  const res = await fetch('/api/content');
  if (!res.ok) throw new Error('Failed to load content');
  return res.json();
}

unlockBtn.addEventListener('click', async () => {
  const pw = pwInput.value.trim();
  if (!pw) return;
  lockError.style.display = 'none';
  try {
    const v = await fetch('/api/verify', { method: 'POST', headers: { 'x-admin-password': pw } });
    if (v.status === 401) {
      lockError.textContent = 'Incorrect password.';
      lockError.style.display = 'block';
      return;
    }
    if (!v.ok) throw new Error('verify failed');
    currentContent = await loadContent();
    ADMIN_PASSWORD = pw;
    ratingInput.value = currentContent.rating || '';
    hoursInput.value = currentContent.hours || 'Monday – Sunday: 10:00 AM – 8:00 PM';
    renderReviews(currentContent.reviews || []);
    lockScreen.style.display = 'none';
    app.style.display = 'block';
  } catch (e) {
    lockError.textContent = "Couldn't reach the server. Try again.";
    lockError.style.display = 'block';
  }
});

saveBtn.addEventListener('click', async () => {
  const reviews = [...reviewsList.children].map(div => ({
    name: div.querySelector('.f-name').value.trim(),
    stars: parseInt(div.querySelector('.f-stars').value, 10),
    text: div.querySelector('.f-text').value.trim(),
    link: div.querySelector('.f-link').value.trim()
  }));
  const payload = { rating: ratingInput.value.trim(), hours: hoursInput.value.trim(), reviews };

  saveStatus.style.display = 'block';
  saveStatus.className = 'admin-status';
  saveStatus.textContent = 'Saving...';

  try {
    const res = await fetch('/api/content', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-admin-password': ADMIN_PASSWORD },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Save failed');
    saveStatus.className = 'admin-status ok';
    saveStatus.textContent = 'Saved. Changes are live on the site now.';
  } catch (e) {
    saveStatus.className = 'admin-status err';
    saveStatus.textContent = 'Error: ' + e.message;
  }
});
</script>
</body>
</html>
